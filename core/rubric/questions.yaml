      "id": "Q1",
      "title": "Password Management",
      "text": "Password Management. The contract must require a documented password standard covering password length/strength, prohibition of default and known-compromised passwords, secure storage (no plaintext; salted hashing if stored), brute-force protections (lockout/rate limiting), prohibition on password sharing, vaulting of privileged credentials/recovery codes, and time-based rotation for break-glass credentials. Based on the contract language and exhibits, what is the compliance state for Password Management?",
      "sub_requirements": [
        {"id": "P1", "text": "documented password standard covering length and strength", "facets": ["documented standard", "password length", "password strength"], "guidance": "Do not invent a minimum length."},
        {"id": "P2", "text": "prohibition of default and known-compromised passwords", "facets": ["default passwords prohibited", "known-compromised passwords prohibited"]},
        {"id": "P3", "text": "secure password storage with no plaintext and salted hashing if stored", "facets": ["no plaintext passwords", "salted hashing if passwords are stored"], "guidance": "Preserve the if-stored condition; non-applicability requires explicit evidence."},
        {"id": "P4", "text": "brute-force protection with lockout or rate limiting", "facets": ["brute-force protection"], "guidance": "Lockout or rate limiting suffices; do not require both or invent numerical thresholds."},
        {"id": "P5", "text": "prohibition on password sharing", "facets": ["password sharing prohibited"]},
        {"id": "P6", "text": "vaulting of privileged credentials and recovery codes", "facets": ["privileged credentials vaulted", "recovery codes vaulted"]},
        {"id": "P7", "text": "time-based rotation for break-glass credentials", "facets": ["time-based break-glass credential rotation"], "guidance": "Do not import a rotation interval from a sample contract."}
      ]
    },
    {
      "id": "Q2",
      "title": "IT Asset Management",
      "text": "IT Asset Management. The contract must require an in-scope asset inventory (including cloud accounts/subscriptions, workloads, databases, security tooling), define minimum inventory fields, require at least quarterly reconciliation/review, and require secure configuration baselines with drift remediation and prohibition of insecure defaults. Based on the contract language and exhibits, what is the compliance state for IT Asset Management?",
      "sub_requirements": [
        {"id": "A1", "text": "in-scope asset inventory including cloud accounts/subscriptions, workloads, databases, and security tooling", "facets": ["cloud accounts/subscriptions inventoried", "workloads inventoried", "databases inventoried", "security tooling inventoried"]},
        {"id": "A2", "text": "minimum asset inventory fields defined", "facets": ["minimum inventory fields defined"], "guidance": "Do not impose the sample contract's field list."},
        {"id": "A3", "text": "asset inventory reconciliation or review at least quarterly", "facets": ["inventory reconciliation/review", "at least quarterly frequency"]},
        {"id": "A4", "text": "secure configuration baselines, drift remediation, and no insecure defaults", "facets": ["secure configuration baselines", "configuration drift remediation", "insecure defaults prohibited"]}
      ]
    },
