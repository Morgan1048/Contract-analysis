        {"id": "T3", "text": "background screening for personnel with access to Company Data to the extent permitted by law", "facets": ["background screening required", "covers personnel with Company Data access"], "guidance": "Preserve the lawful-screening qualification."},
        {"id": "T4", "text": "maintaining a background screening policy plus attestation or evidence", "facets": ["screening policy maintained", "screening attestation/evidence maintained"]}
      ]
